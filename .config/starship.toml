"$schema" = 'https://starship.rs/config-schema.json'

# Explicit prefix so `$vcs` can be placed where the git_* modules used to sit.
# `$all` covers the remaining tail, so new modules in future starship releases
# still appear automatically without editing this list.
format = "$username$hostname$localip$shlvl$singularity$kubernetes$nats$directory$vcsh$vcs$all"

# Statusline profile for Claude Code (`starship statusline claude-code`).
# Uses $vcs rather than the default profile's $git_branch, which is disabled below.
[profiles]
claude-code = "$claude_model${custom.claude_dir}$vcs$claude_context$claude_cost"

# --- unified VCS ------------------------------------------------------------
# The vcs module delegates to the git_*/hg_*/etc. modules listed in its
# *_modules options. Those submodules must be disabled at the top level or they
# render twice (verified); `disabled` does not stop vcs from delegating to them.
[vcs]
order = ["git", "hg"]

[fossil_branch]
disabled = true
[fossil_metrics]
disabled = true
[git_branch]
disabled = true
[git_commit]
disabled = true
[git_state]
disabled = true
[git_metrics]
disabled = true
[hg_branch]
disabled = true
[hg_state]
disabled = true
[pijul_channel]
disabled = true

# --- git status: staged vs unstaged split (starship 1.25+) -------------------
# First bracket = index/staged, second = worktree/unstaged. Each hides on its own.
[git_status]
disabled = true
format = '(\[$index_added$index_modified$index_deleted$index_typechanged$renamed\]($style) )(\[$worktree_added$worktree_modified$worktree_deleted$worktree_typechanged$untracked\]($style) )([$conflicted$stashed$ahead_behind]($style) )'
ahead = "⇡"
behind = "⇣"
stashed = '⚑'
deleted = "✖"
# worktree_*/index_* all default to "" (opt-in), so each needs a symbol.
index_added = "+"
index_modified = "!"
index_deleted = "✖"
index_typechanged = "±"
worktree_added = "+"
worktree_modified = "!"
worktree_deleted = "✖"
worktree_typechanged = "±"

# --- Claude Code statusline modules -----------------------------------------
[claude_model]
format = "[$symbol$model]($style) "
symbol = "✳ "
style = "bold blue"

[claude_context]
format = "[$gauge $percentage]($style) "
gauge_width = 8

[claude_cost]
# `$` must be escaped as \\$ in format; a bare "$ " in `symbol` parses as a variable.
format = "[$symbol\\$$cost]($style) "
symbol = ""

# --- languages --------------------------------------------------------------
[nodejs]
format = "[$symbol($version )]($style)"
version_format = "v${major}"

[php]
format = "[$symbol($version )]($style)"
version_format = "v${major}.${minor}"

[python]
format = "[$symbol($version )]($style)"
version_format = "v${major}.${minor}"

[rust]
format = "[$symbol($version )]($style)"
version_format = "v${major}.${minor}"

# --- disabled ---------------------------------------------------------------
[aws]
disabled = true

[gcloud]
disabled = true

[package]
disabled = true

[vagrant]
disabled = true

[time]
disabled = true

# --- misc -------------------------------------------------------------------
[directory]
truncate_to_repo = false

# Stand-in for $directory in the claude-code profile: same rendering, but it
# hides itself inside a git worktree, where $vcs's branch name already says
# which checkout this is. Gated on STARSHIP_CLAUDE_STATUSLINE (exported by the
# statusLine command in ~/.claude/settings.json) because `$all` in the top-level
# format would otherwise render it in the shell prompt next to $directory.
[custom.claude_dir]
description = "Working directory, omitted inside a git worktree"
shell = ["/bin/sh"]
when = '''
test -n "$STARSHIP_CLAUDE_STATUSLINE" || exit 1
test "$(git rev-parse --git-dir 2>/dev/null)" = "$(git rev-parse --git-common-dir 2>/dev/null)"
'''
# Mirrors [directory]'s rendering: ~ for $HOME, last 3 components.
command = '''
printf '%s' "$PWD" | sed "s|^$HOME|~|" |
  awk -F/ '{for (i = NF > 3 ? NF - 2 : 1; i <= NF; i++) out = out $i (i < NF ? "/" : "")
            print out}'
'''
style = "bold cyan"
format = "[$output]($style) "

[docker_context]
format = '$symbol'
